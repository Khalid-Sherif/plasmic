services:
   plasmic-db:
      image: postgres:15-alpine
      restart: always
      environment:
         - POSTGRES_PASSWORD=${DB_PASSWORD}
         - POSTGRES_USER=${DB_USER}
         - POSTGRES_DB=${DB_NAME}
      volumes:
         - postgres_data:/var/lib/postgresql/data
      healthcheck:
         test:
            - CMD-SHELL
            - 'pg_isready -U ${DB_USER} -d ${DB_NAME}'
         interval: 5s
         timeout: 10s
         retries: 5

   plasmic-wab:
      build:
         context: .
         dockerfile: Dockerfile.coolify
         target: runtime
         args:
            - PUBLIC_URL=${PUBLIC_URL}
            - REACT_APP_DEFAULT_HOST_URL=${CANVAS_URL}
      restart: always
      ports:
         - 3003:3003
         - 3004:3004
         - 3005:3005
      depends_on:
         plasmic-db:
            condition: service_healthy
      environment:
         - DATABASE_URI=postgres://${DB_USER}:${DB_PASSWORD}@plasmic-db:5432/${DB_NAME}
         - WAB_DBNAME=${DB_NAME}
         - WAB_DBPASSWORD=${DB_PASSWORD}
         - NODE_ENV=${NODE_ENV}
         - POSTGRES_USER=${DB_USER}
         - POSTGRES_PASSWORD=${DB_PASSWORD}
         - POSTGRES_DATABASE=${DB_NAME}
         - POSTGRES_HOST=plasmic-db
         - CHOKIDAR_USEPOLLING=true
         - DB_USER=${DB_USER}
         - DB_PASSWORD=${DB_PASSWORD}
         - DB_NAME=${DB_NAME}
         - ENCRYPTION_KEY=${ENCRYPTION_KEY}
         - SESSION_SECRET=${SESSION_SECRET}
         - HOST=${PUBLIC_URL}
         - PUBLIC_URL=${PUBLIC_URL}
         - STATIC_URL=${STATIC_URL}
         - REACT_APP_DEV_HOST_PROXY=${REACT_APP_DEV_HOST_PROXY}
         - BACKEND_HOST=${PUBLIC_URL}
         - NEXT_PUBLIC_HOST=${PUBLIC_URL}
         - POSTHOG_HOST=${POSTHOG_HOST}
         - POSTHOG_API_KEY=${POSTHOG_API_KEY}
         - POSTHOG_REVERSE_PROXY_HOST=${POSTHOG_REVERSE_PROXY_HOST}
         - SENTRY_DSN=${SENTRY_DSN}
         - SENTRY_ORG_ID=${SENTRY_ORG_ID}
         - SENTRY_PROJECT_ID=${SENTRY_PROJECT_ID}
         - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      tty: true
      stdin_open: true

   garage:
      image: dxflrs/garage:v2.3.0
      restart: always
      networks:
         - garage-net
      command: ["/garage", "server", "--single-node", "--default-access-key", "--default-bucket"]
      environment:
         - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_ACCESS_KEY}
         - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_SECRET_KEY}
         - GARAGE_DEFAULT_BUCKET=plasmic-assets
      volumes:
         - /mnt/data/plasmic/garage/garage.toml:/etc/garage.toml
         - garage_meta:/var/lib/garage/meta
         - garage_data:/var/lib/garage/data
      ports:
         - 9010:3900
         - 9012:3902

   garage-webui:
      image: khairul169/garage-webui:latest
      restart: always
      networks:
         - garage-net
      environment:
         - CONFIG_PATH=/etc/garage.toml
         - GARAGE_API_URL=http://garage:3903
      volumes:
         - /mnt/data/plasmic/garage/garage.toml:/etc/garage.toml:ro
      ports:
         - 9011:3000

networks:
   garage-net:
      driver: bridge

volumes:
   postgres_data:
      driver: local
      driver_opts:
         type: none
         o: bind
         device: /mnt/data/plasmic/postgres_data

   garage_meta:
      driver: local
      driver_opts:
         type: none
         o: bind
         device: /mnt/data/plasmic/garage/meta
   garage_data:
      driver: local
      driver_opts:
         type: none
         o: bind
         device: /mnt/data/plasmic/garage/data
